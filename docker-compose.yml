services:
  api:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: table_gen_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${TABLE_GEN_API_PORT:-8010}:8000"
    volumes:
      - "${TABLE_GEN_DATA_HOST_PATH:-./data}:/app/data"
    depends_on:
      - step-generate
      - step-vectorize
      - step-segment
      - step-palette
    restart: unless-stopped

  step-generate:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: table_gen_step_generate
    command: uvicorn app.step_generate:app --host 0.0.0.0 --port 8001
    volumes:
      - "${TABLE_GEN_DATA_HOST_PATH:-./data}:/app/data"
      - "${TABLE_GEN_COMFYUI_WORKFLOW_HOST_PATH:-./ComfyUI_00050_2.json}:${TABLE_GEN_COMFYUI_WORKFLOW_PATH:-/app/workflows/ComfyUI_00050_2.json}:ro"
    restart: unless-stopped

  step-vectorize:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: table_gen_step_vectorize
    command: uvicorn app.step_vectorize:app --host 0.0.0.0 --port 8002
    volumes:
      - "${TABLE_GEN_DATA_HOST_PATH:-./data}:/app/data"
    restart: unless-stopped

  step-segment:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: table_gen_step_segment
    command: uvicorn app.step_segment:app --host 0.0.0.0 --port 8004
    volumes:
      - "${TABLE_GEN_DATA_HOST_PATH:-./data}:/app/data"
    restart: unless-stopped

  step-palette:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: table_gen_step_palette
    command: uvicorn app.step_palette:app --host 0.0.0.0 --port 8003
    volumes:
      - "${TABLE_GEN_DATA_HOST_PATH:-./data}:/app/data"
    restart: unless-stopped

  frontend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: table_gen_frontend
    ports:
      - "${TABLE_GEN_FRONTEND_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped
