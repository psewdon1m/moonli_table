[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-gen"
version = "0.1.0"
description = "Phase 1 API-first prototype for content pack generation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "python-multipart>=0.0.20,<1.0.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0",
]
